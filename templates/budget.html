```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Budget</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .budget-container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .current-budget {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
        }

        .current-budget span {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>

<body>

    <div class="budget-container">

        <h1>Set Budget</h1>

        <p class="subtitle">
            Manage your monthly spending limit
        </p>

        {% if message %}
        <div class="success">
            {{ message }}
        </div>
        {% endif %}

        {% if budget %}
        <div class="current-budget">
            <p>Current Monthly Budget</p>
            <span>₹{{ budget }}</span>
        </div>
        {% endif %}

        <form method="POST">

            <label for="budget">
                Monthly Budget
            </label>

            <input
                type="number"
                id="budget"
                name="budget"
                placeholder="Enter amount"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">
                Set Budget
            </button>

        </form>

        <a href="/" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
```
