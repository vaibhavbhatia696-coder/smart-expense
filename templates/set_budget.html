```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Budget</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #222;
            text-decoration: none;
        }

        .message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Set Budget</h1>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="budget">Monthly Budget</label>

            <input
                type="number"
                id="budget"
                name="budget"
                placeholder="Enter your budget"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">
                Set Budget
            </button>

        </form>

        <a href="/" class="back">← Back to Dashboard</a>

    </div>

</div>

</body>
</html>
```
